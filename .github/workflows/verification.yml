name: Lean verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-latest
    # The grobner curvature certificates are slow, and run slower still once
    # they spill into swap. Allow the full hosted-runner limit.
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      # A hosted runner has 16 GB of RAM. Each large Kerr curvature module
      # (KerrVacuumTime, KerrVacuumSpatial*, KerrVacuumMixed) needs more than
      # that, even when built alone. Running out of memory kills the runner
      # ("received a shutdown signal", exit code 143), so give it swap.
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          # Keep 16 GB for the Mathlib cache, the project build and the job cache.
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          root_size=$(( root_free - 16 ))
          mnt_size=0
          if mountpoint -q /mnt; then
            mnt_free=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
            mnt_size=$(( mnt_free - 2 ))
          fi
          if [ "$mnt_size" -gt "$root_size" ]; then
            swapfile=/mnt/swapfile; size=$mnt_size
          else
            swapfile=/swapfile; size=$root_size
          fi
          [ "$size" -gt 64 ] && size=64
          sudo fallocate -l "${size}G" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h / /mnt || true
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          leanchecker: "false"
      # lean-action saves its cache before the proofs are built. Cache the
      # project's own build outputs separately so later runs skip unchanged
      # certificate modules. Lake re-checks source hashes, so stale entries
      # are rebuilt rather than trusted.
      - name: Restore project build
        uses: actions/cache/restore@v4
        with:
          path: verification/.lake/build
          key: proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-
      - name: Build, audit axioms and replay proofs
        working-directory: verification
        run: |
          # Log memory once a minute, so a runner that is killed for lack of
          # memory still leaves a record in this step's output.
          (
            while sleep 60; do
              free -m | awk '/Mem:/ {m=$3} /Swap:/ {s=$3} END {printf "[memory] ram %d MB, swap %d MB\n", m, s}'
            done
          ) &
          monitor=$!
          trap 'kill $monitor' EXIT
          python3 -u check.py
      - name: Save project build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: verification/.lake/build
          key: proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-${{ github.sha }}
