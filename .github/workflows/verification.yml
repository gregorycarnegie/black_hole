name: Lean verification

on:
  push:
    branches: [main]
    paths: &proof-inputs
      - 'verification/**/*.lean'
      - 'verification/lean-toolchain'
      - 'verification/lakefile.toml'
      - 'verification/lake-manifest.json'
      - 'verification/fixtures/horizon-binary32.csv'
      - 'verification/check.py'
      - '.github/workflows/verification.yml'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths: *proof-inputs
  workflow_dispatch:

permissions:
  contents: read

# Let a running proof finish so later pushes can reuse its build.
concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: false

env:
  LEAN_NUM_THREADS: '1'

jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The curvature modules can exceed the hosted runner's memory even in serial.
      - &swap
        name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          # Keep 16 GB for the Mathlib cache, the project build and the job cache.
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          root_size=$(( root_free - 16 ))
          mnt_size=0
          if mountpoint -q /mnt; then
            mnt_free=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
            mnt_size=$(( mnt_free - 2 ))
          fi
          if [ "$mnt_size" -gt "$root_size" ]; then
            swapfile=/mnt/swapfile; size=$mnt_size
          else
            swapfile=/swapfile; size=$root_size
          fi
          if [ "$size" -lt 1 ]; then
            echo '::error::Insufficient disk space for Lean swap'
            df -h / /mnt
            exit 1
          fi
          [ "$size" -gt 64 ] && size=64
          sudo fallocate -l "${size}G" "$swapfile"
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h / /mnt || true
      - &checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - &dependencies
        name: Cache Lean dependencies
        id: dependencies
        uses: actions/cache@v6
        with:
          path: verification/.lake/packages
          key: lean-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}
      - &lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verification
          use-github-cache: 'false'
          use-mathlib-cache: ${{ steps.dependencies.outputs.cache-hit != 'true' }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          leanchecker: 'false'
      # Keep partial builds across attempts. Lake checks source hashes before reuse.
      - name: Restore project build
        id: proof-cache
        uses: actions/cache/restore@v6
        with:
          path: verification/.lake/build
          key: proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-${{ github.sha }}
            proofs-build-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain', 'verification/lake-manifest.json') }}-
      - name: Build proofs and audit axioms
        working-directory: verification
        timeout-minutes: 330
        env:
          PROOF_PHASE: --build
        run: &check |
          # Keep a memory record if the runner is killed.
          (
            while sleep 60; do
              free -m | awk '/Mem:/ {m=$3} /Swap:/ {s=$3} END {printf "[memory] ram %d MB, swap %d MB\n", m, s}'
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          python3 -u check.py "$PROOF_PHASE"
      - name: Archive Lean modules for replay
        run: |
          tar --zstd -cf "$RUNNER_TEMP/lean-modules.tar.zst" -C verification/.lake/build lib/lean
      - name: Upload Lean modules
        uses: actions/upload-artifact@v7
        with:
          name: lean-modules
          path: ${{ runner.temp }}/lean-modules.tar.zst
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
      - name: Save project build
        if: ${{ !cancelled() && steps.proof-cache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: verification/.lake/build
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}

  # The independent replay gets its own runner time budget and this run's modules.
  replay:
    needs: proofs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - *swap
      - *checkout
      - *dependencies
      - *lean
      - name: Download Lean modules from this run
        uses: actions/download-artifact@v8
        with:
          name: lean-modules
          path: ${{ runner.temp }}
      - name: Extract Lean modules
        run: |
          mkdir -p verification/.lake/build
          tar --zstd -xf "$RUNNER_TEMP/lean-modules.tar.zst" -C verification/.lake/build
      - name: Replay proofs in the kernel
        working-directory: verification
        env:
          PROOF_PHASE: --replay
        run: *check
