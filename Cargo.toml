[package]
name = "black_hole"
version = "0.4.0"
edition = "2024"

[dependencies]
bevy = "0.20.0"
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
mutants = "0.0.4"
# Reuse Bevy's shader validator for offline WGSL regression checks.
naga = { version = "30.0.1", features = ["wgsl-in"] }
proptest = "1.11.0"
rstest = "0.27.0"

# Fast compiles in dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
