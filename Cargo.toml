[package]
name = "black_hole"
version = "0.4.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
num-bigint = "0.5.1"

[dev-dependencies]
num-rational = "0.4.2"
mutants = "0.0.4"
# Reuse Bevy's WESL compiler and shader validator for offline regression checks.
naga = { version = "30.0.1", features = ["wgsl-in", "spv-in", "spv-out"] }
proptest = "1.12.0"
rstest = "0.28.0"
wesl = "0.6.0"

# Fast compiles in dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
