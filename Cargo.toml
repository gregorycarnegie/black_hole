[package]
name = "black_hole"
version = "0.5.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
libloading = { version = "0.9.1", optional = true }
num-bigint = "0.5.1"

[dev-dependencies]
googletest = "0.14.4"
num-rational = "0.4.2"
mutants = "0.0.4"
proptest = "1.12.0"
rstest = "0.29.0"

# Fast compiles in dev
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
bindgen = { version = "0.73.2", optional = true, default-features = false, features = ["runtime"] }

[features]
# Experimental OptiX ray queries. Needs OPTIX_ROOT pointing at the OptiX SDK headers.
optix = ["dep:libloading", "dep:bindgen"]
