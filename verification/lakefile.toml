name = "black_hole_verification"
version = "0.1.0"
defaultTargets = ["BlackHole"]

[leanOptions]
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "BlackHole"
extraDepTargets = ["horizonFixtures", "kernelFixtures", "branchingFixtures"]

[[input_file]]
name = "horizonFixtures"
path = "fixtures/horizon-binary32.csv"
text = true

[[input_file]]
name = "kernelFixtures"
path = "fixtures/kernels.sexp"
text = true

[[input_file]]
name = "branchingFixtures"
path = "fixtures/kernels-branching.sexp"
text = true

[[lean_exe]]
name = "certify"
root = "Certify"
